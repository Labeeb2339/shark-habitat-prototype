name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  syntax-and-secret-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python sources
        run: python -m compileall -q app.py automatic_nasa_framework.py tests
      - name: Run standard-library tests
        run: python -m unittest discover -s tests -v
