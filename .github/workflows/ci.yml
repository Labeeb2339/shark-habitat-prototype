name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  syntax-and-secret-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python sources
        run: python -m compileall -q app.py automatic_nasa_framework.py tests
      - name: Run standard-library tests
        run: python -m unittest discover -s tests -v

  app-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Run runtime-dependent tests
        run: python -m unittest discover -s tests -v
      - name: Start Streamlit and verify health
        shell: bash
        run: |
          streamlit run app.py \
            --server.headless true \
            --server.port 8501 \
            >streamlit.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health; then
              exit 0
            fi
            sleep 1
          done
          cat streamlit.log
          exit 1
